{% if weapons %}
<ul class="max-h-72 divide-y divide-slate-800 overflow-y-auto rounded-lg border border-slate-700 bg-slate-800 shadow-xl">
    {% for w in weapons %}
    <li>
        <button
            type="button"
            data-pk="{{ w.pk }}"
            data-name="{{ w.name }}"
            onclick="selectWeaponSuggestion(this)"
            class="flex w-full items-center justify-between gap-3 px-3 py-2 text-left text-sm hover:bg-slate-700"
        >
            <span class="text-slate-100">{{ w.name }}</span>
            <span class="flex shrink-0 items-center gap-2">
                <span class="rounded bg-slate-700 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-slate-300">
                    {{ w.get_weapon_type_display }}
                </span>
                <span class="text-xs text-slate-400">{{ w.attack_display }} atk</span>
            </span>
        </button>
    </li>
    {% endfor %}
</ul>
{% elif q %}
<div class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-400 shadow-xl">
    No matches for "{{ q }}".
</div>
{% endif %}

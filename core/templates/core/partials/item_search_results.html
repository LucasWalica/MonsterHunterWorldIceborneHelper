{% if items %}
<div class="rounded-xl border border-slate-800 bg-slate-900 overflow-hidden">
    <div class="grid grid-cols-4 gap-1 p-3 border-b border-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-900/50">
        <div>Item</div>
        <div class="text-center">Rarity</div>
        <div>Type</div>
        <div></div>
    </div>
    {% for item in items %}
    <a href="{% url 'core:item_detail' item.pk %}" class="grid grid-cols-4 gap-1 p-3 border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors">
        <div class="flex items-center gap-3">
            <span class="font-medium text-slate-100">{{ item.name }}</span>
        </div>
        <div class="flex items-center justify-center">
            <span class="text-amber-400">★{{ item.rarity }}</span>
        </div>
        <div class="flex items-center text-slate-400 text-sm">
            {{ item.get_type_display }}
        </div>
        <div class="flex items-center justify-end">
            <span class="text-amber-400 hover:text-amber-300 text-sm">View</span>
        </div>
    </a>
    {% endfor %}
</div>
{% elif q %}
<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-400">
    No items found for "{{ q }}".
</div>
{% else %}
<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-400">
    Start typing to search items and materials.
</div>
{% endif %}

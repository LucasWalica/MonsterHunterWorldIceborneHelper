{% if skills %}
<div class="rounded-xl border border-slate-800 bg-slate-900 overflow-hidden">
    <div class="hidden sm:grid sm:grid-cols-3 gap-1 p-3 border-b border-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-900/50">
        <div>Skill</div>
        <div class="text-center">Max Lv</div>
        <div class="text-center">Description</div>
    </div>
    {% for skill in skills %}
    <div class="grid grid-cols-2 gap-2 p-3 border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors sm:grid-cols-3 sm:gap-1">
        <div class="flex items-center gap-3">
            <span class="font-medium text-slate-100">{{ skill.name }}</span>
        </div>
        <div class="flex items-center justify-end sm:justify-center">
            <span class="rounded bg-amber-500/20 px-2 py-0.5 text-xs font-bold text-amber-400">Lv{{ skill.max_level }}</span>
        </div>
        <div class="col-span-2 flex items-center text-slate-400 text-sm truncate sm:col-span-1 sm:pr-4">
            {{ skill.description|default:"No description" }}
        </div>
    </div>
    {% endfor %}
</div>
{% elif q %}
<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-400">
    No skills found for "{{ q }}".
</div>
{% else %}
<div class="rounded-xl border border-slate-800 bg-slate-900 p-8 text-center text-slate-400">
    No skills available.
</div>
{% endif %}

{% load mhw_extras %}
<div class="flex items-center justify-between">
    <p class="text-sm text-slate-400" id="weapon-count">
        <span class="font-semibold text-slate-100">{{ count }}</span> shown of {{ total }} weapons
    </p>
    <span class="htmx-indicator inline-flex items-center gap-2 text-xs text-amber-400">
        <span class="inline-block h-3 w-3 animate-spin rounded-full border-2 border-amber-400 border-t-transparent"></span>
        Loading...
    </span>
</div>

{% if weapons %}
<ul id="weapon-grid" class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {% include "core/partials/weapon_cards.html" %}
</ul>

{% if has_more %}
<div class="mt-4 flex justify-center">
    <button
        type="button"
        hx-get="{% url 'core:weapon_list' %}?offset={{ next_offset }}&load_more=1"
        hx-target="#weapon-grid"
        hx-swap="beforeend"
        hx-include="#weapon-filter-form"
        class="rounded-lg border border-slate-700 px-4 py-2 text-sm text-slate-300 hover:border-amber-500 hover:text-amber-400"
    >
        Load more ({{ remaining }} remaining)
    </button>
</div>
{% endif %}
{% else %}
<div class="mt-6 rounded-xl border border-dashed border-slate-700 bg-slate-900 p-10 text-center text-slate-400">
    No weapons match the filters.
</div>
{% endif %}
